<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนท่องศัพท์รายวัน · สรุปเข้ม VOCAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182430; --ink-soft:#3a4a58;
    --paper:#faf3e6; --paper-shade:#efe4cf;
    --night:#141d27; --night-2:#1b2632;
    --crimson:#b3273c; --crimson-dark:#8c1e30;
    --sage:#4f7a5c; --gold:#b0904f; --gold-soft:#d9c48f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(179,39,60,0.10), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(176,144,79,0.14), transparent 55%),
      var(--night);
    color:var(--paper);
    font-family:'Sarabun',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:24px 14px 56px;
  }
  .wrap{width:100%; max-width:460px;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:14px;text-align:center;}
  .brand .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-soft);}
  .brand h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(24px,5.4vw,34px);margin:2px 0 0;}
  .brand .sub{font-size:12.5px;color:#a9b6c1;margin-top:2px;}

  .info-banner{
    background:rgba(176,144,79,0.10);border:1px solid rgba(176,144,79,0.35);border-radius:10px;
    padding:12px 14px;font-size:12.5px;line-height:1.6;color:#e4d9c0;margin-bottom:12px;
  }
  .info-banner b{color:var(--gold-soft);}

  .stats-bar{
    display:flex;gap:8px;margin-bottom:14px;
  }
  .stat-card{
    flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;
    padding:10px 12px;text-align:center;
  }
  .stat-card .sv{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--paper);}
  .stat-card .sl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;color:#9fb0bd;margin-top:2px;}
  .stat-card.sage .sv{color:var(--sage);}
  .stat-card.gold .sv{color:var(--gold-soft);}
  .stat-card.crimson .sv{color:var(--crimson);}

  .search-box{position:relative;margin-bottom:10px;}
  .search-box input{
    width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);
    color:var(--paper);padding:10px 12px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:14px;outline:none;
  }
  .search-box input:focus{border-color:var(--gold);}
  .search-results{margin-top:6px;background:var(--paper);border-radius:8px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.4);display:none;}
  .search-results.show{display:block;}
  .search-row{padding:9px 12px;border-bottom:1px solid rgba(24,36,48,0.08);cursor:pointer;}
  .search-row:last-child{border-bottom:none;}
  .search-row .sw{font-family:'Fraunces',serif;font-weight:600;color:var(--ink);font-size:15px;}
  .search-row .sr{display:none;color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .search-row.open .sr{display:block;}

  .toolrow{display:flex;gap:8px;margin-bottom:16px;}
  .tool-btn{
    flex:1;font-family:'JetBrains Mono',monospace;font-size:11.5px;text-align:center;
    padding:10px 6px;border-radius:8px;border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.03);color:#c7d1da;cursor:pointer;
  }
  .tool-btn.active{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:600;}

  .root-panel{display:none;margin-bottom:16px;}
  .root-panel.show{display:block;}
  .root-group{background:var(--paper);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .root-group-head{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;}
  .root-group-body{display:none;padding:6px 14px 12px;}
  .root-group.open .root-group-body{display:block;}
  .root-group.open .root-group-head{border-bottom:1px dashed rgba(24,36,48,0.15);}

  .day-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:thin;}
  .day-chip{
    flex:0 0 auto;width:46px;height:52px;border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer;
    border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:#8b98a3;
  }
  .day-chip .dn{font-size:13px;font-weight:600;color:var(--paper);}
  .day-chip.locked{opacity:.35;cursor:not-allowed;}
  .day-chip.locked .dn{color:#8b98a3;}
  .day-chip.completed{background:rgba(79,122,92,0.18);border-color:var(--sage);}
  .day-chip.completed .dn{color:var(--sage);}
  .day-chip.current{background:var(--crimson);border-color:var(--crimson);}
  .day-chip.current .dn{color:#fff;}
  .day-chip.nocontent{opacity:.3;}

  .day-panel{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:16px;}
  .day-panel-head{margin-bottom:14px;}
  .day-panel-head .dtitle{font-family:'Fraunces',serif;font-weight:700;font-size:20px;}
  .day-panel-head .ddate{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--gold-soft);margin-top:2px;}
  .day-panel-head .dstatus{font-size:12px;margin-top:6px;color:#9fb0bd;}
  .day-panel-head .dstatus.behind{color:var(--crimson);}
  .day-panel-head .dstatus.ontrack{color:var(--sage);}
  .day-panel-head .dprogress{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold-soft);margin-top:4px;}

  .empty-day{text-align:center;padding:40px 10px;color:#9fb0bd;font-size:13.5px;line-height:1.7;}
  .locked-day{text-align:center;padding:40px 10px;}
  .locked-day .lock-icon{font-size:32px;margin-bottom:10px;}
  .locked-day p{color:#c7d1da;font-size:13.5px;line-height:1.7;margin:0 0 14px;}
  .locked-day button{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--crimson);color:#fff;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;}

  .section-title{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em;color:var(--gold-soft);margin:0 0 10px;display:flex;align-items:center;gap:6px;}
  .review-block{background:rgba(79,122,92,0.08);border:1px solid rgba(79,122,92,0.3);border-radius:10px;padding:12px;margin-bottom:16px;}
  .review-group-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sage);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 8px;}
  .review-group-label:first-child{margin-top:0;}

  /* mini word block: word row + tiny practice canvas, applied to EVERY word */
  .mini-block{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .mini-block:last-child{margin-bottom:0;}
  .mini-toprow{display:flex;align-items:center;gap:7px;}
  .mini-toprow .mw{font-family:'Fraunces',serif;font-weight:600;font-size:14.5px;flex:1;cursor:pointer;}
  .mini-toprow .mw .mt{display:block;font-family:'Sarabun',sans-serif;font-weight:400;font-size:12px;color:var(--gold-soft);margin-top:2px;}
  .mini-speak,.mini-known,.mini-pcheck{width:23px;height:23px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;color:var(--paper);}
  .mini-speak{border-radius:50%;}
  .mini-speak svg{width:10px;height:10px;}
  .mini-known.on{background:var(--sage);border-color:var(--sage);}
  .mini-known svg{width:11px;height:11px;color:#fff;display:none;}
  .mini-known.on svg{display:block;}
  .mini-pcheck{color:var(--gold);font-size:12px;}
  .mini-pcheck.on{background:var(--gold);border-color:var(--gold);color:var(--night);}
  .mini-canvas-wrap{margin-top:7px;}
  canvas.mini-hw{width:100%;height:56px;border-radius:7px;border:1px solid rgba(176,144,79,0.3);background:rgba(176,144,79,0.05);touch-action:none;display:block;}

  .ack-row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:#c7d1da;cursor:pointer;}
  .ack-row input{width:16px;height:16px;}

  .overlay-lock{position:relative;}
  .overlay-lock .oly{position:absolute;inset:0;background:rgba(20,29,39,0.86);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:12.5px;color:#c7d1da;z-index:5;line-height:1.6;}

  /* flip card (new words) */
  /* NOTE: intentionally NOT using a 3D rotateY flip here. backface-visibility:hidden
     combined with overflow:hidden + border-radius is buggy on iOS Safari and some
     Android WebViews -- both faces render at once (mirrored). A plain crossfade
     between two absolutely-positioned faces works identically everywhere. */
  .stage{width:100%;aspect-ratio:5/7.4;margin-bottom:12px;position:relative;}
  .card{position:absolute;inset:0;cursor:pointer;}
  .face{
    position:absolute;inset:0;border-radius:10px;background:var(--paper);color:var(--ink);
    box-shadow:0 18px 40px -12px rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.15);
    display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(0,0,0,0.06);
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s ease;
  }
  .face.front{opacity:1;visibility:visible;pointer-events:auto;}
  .card.flipped .face.front{opacity:0;visibility:hidden;pointer-events:none;}
  .card.flipped .face.back{opacity:1;visibility:visible;pointer-events:auto;}
  .face::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom,transparent,transparent 27px,rgba(24,36,48,0.05) 27px,rgba(24,36,48,0.05) 28px);pointer-events:none;}
  .face::after{content:"";position:absolute;top:0;bottom:0;left:36px;width:1px;background:rgba(179,39,60,0.25);pointer-events:none;}
  .tab{position:absolute;top:-1px;left:24px;background:var(--crimson);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.06em;padding:5px 11px 6px;border-radius:0 0 6px 6px;z-index:2;}
  .hole{position:absolute;top:14px;right:18px;width:13px;height:13px;border-radius:50%;background:var(--night);box-shadow:inset 0 2px 3px rgba(0,0,0,.5);z-index:2;}
  .speak-btn{position:absolute;top:12px;right:40px;width:24px;height:24px;border-radius:50%;border:1px solid rgba(24,36,48,0.18);background:rgba(24,36,48,0.04);color:var(--crimson);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;}
  .speak-btn svg{width:12px;height:12px;}
  .face-content{position:relative;z-index:1;padding:48px 24px 16px 46px;display:flex;flex-direction:column;height:100%;}
  .pos-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--crimson);letter-spacing:.05em;margin-bottom:6px;}
  .headword{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(24px,6vw,34px);line-height:1.05;margin:0 0 10px;}
  .canvas-wrap{margin-top:4px;}
  .canvas-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  .canvas-label button{font-family:'JetBrains Mono',monospace;font-size:9.5px;background:none;border:1px solid rgba(176,144,79,0.4);color:var(--gold);border-radius:5px;padding:2px 8px;cursor:pointer;}
  canvas.hw{width:100%;height:120px;border-radius:8px;border:1px solid rgba(176,144,79,0.35);background:rgba(176,144,79,0.05);touch-action:none;display:block;}
  .practiced-note{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sage);margin-top:6px;display:none;align-items:center;gap:4px;}
  .practiced-note.show{display:flex;}
  .flip-hint{font-family:'JetBrains Mono',monospace;font-size:10px;color:#8b6b3d;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:5px;margin-top:auto;padding-top:8px;}
  .flip-hint svg{width:12px;height:12px;}

  .back .face-content{padding:44px 22px 16px 46px;}
  .root-chip{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold);background:rgba(176,144,79,0.12);border:1px solid rgba(176,144,79,0.3);border-radius:5px;padding:2px 7px;margin-bottom:8px;}
  .thai-meaning{font-family:'Sarabun',sans-serif;font-weight:600;font-size:clamp(17px,4.2vw,20px);margin:0 0 10px;line-height:1.35;}
  .section-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);margin:0 0 5px;}
  .usage-note{
    font-family:'Sarabun',sans-serif;font-size:12.5px;color:var(--ink-soft);line-height:1.55;
    background:rgba(176,144,79,0.08);border:1px solid rgba(176,144,79,0.28);border-radius:7px;
    padding:8px 10px;margin-bottom:10px;
  }
  .usage-note-label{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
  .example-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.04em;color:var(--gold);margin-top:6px;padding-top:8px;border-top:1px dashed rgba(24,36,48,0.2);line-height:1.4;}
  .example{font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--ink-soft);line-height:1.4;margin-bottom:8px;}
  .example::before{content:"\201C";} .example::after{content:"\201D";}
  .mysent-wrap textarea{
    width:100%;resize:none;min-height:42px;font-family:'Sarabun',sans-serif;font-size:12.5px;color:var(--ink);
    background:rgba(176,144,79,0.08);border:1px solid rgba(176,144,79,0.3);border-radius:7px;padding:7px 9px;outline:none;margin-top:auto;
  }

  .card-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
  .cbtn{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:10px 6px;border-radius:8px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.04);color:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
  .cbtn.primary{background:var(--crimson);border-color:var(--crimson);}
  .cbtn.known{grid-column:span 3;background:rgba(79,122,92,0.14);border-color:rgba(79,122,92,0.4);color:var(--sage);}
  .cbtn.known.active{background:var(--sage);border-color:var(--sage);color:#fff;}
  .card-pos{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#9fb0bd;margin-bottom:10px;}

  .finish-btn{width:100%;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;background:linear-gradient(90deg,var(--crimson),var(--crimson-dark));color:#fff;border:none;border-radius:9px;padding:14px;cursor:pointer;margin-top:4px;}

  /* ===== daily quiz ===== */
  .mode-switch{display:flex;gap:8px;margin-bottom:12px;}
  .mode-switch-btn{
    flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;padding:9px 6px;
    border-radius:8px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.03);color:#c7d1da;cursor:pointer;
  }
  .mode-switch-btn.active{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:600;}
  .quiz-wrap{background:var(--paper);border-radius:10px;padding:20px 18px;color:var(--ink);min-height:260px;display:flex;flex-direction:column;}
  .quiz-progress{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--crimson);letter-spacing:.04em;margin-bottom:14px;}
  .quiz-word{font-family:'Fraunces',serif;font-weight:700;font-size:22px;margin-bottom:16px;line-height:1.3;}
  .quiz-fill{font-family:'Fraunces',serif;font-style:italic;font-size:17px;line-height:1.55;margin-bottom:16px;}
  .quiz-choices{display:flex;flex-direction:column;gap:8px;}
  .quiz-choice{
    font-family:'Sarabun',sans-serif;font-size:14px;padding:11px 14px;border-radius:8px;
    border:1px solid rgba(24,36,48,0.15);background:rgba(24,36,48,0.02);cursor:pointer;transition:all .15s ease;
  }
  .quiz-choice:hover{border-color:rgba(24,36,48,0.3);}
  .quiz-choice.correct{background:rgba(79,122,92,0.16);border-color:var(--sage);color:var(--sage);font-weight:600;}
  .quiz-choice.wrong{background:rgba(179,39,60,0.12);border-color:var(--crimson);color:var(--crimson);}
  .quiz-example{font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}
  .quiz-result{background:var(--paper);border-radius:10px;padding:40px 20px;color:var(--ink);text-align:center;}
  .quiz-result-score{font-family:'Fraunces',serif;font-weight:700;font-size:40px;color:var(--crimson);}
  .quiz-result-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .finish-btn:disabled{opacity:.35;cursor:not-allowed;}

  .sync-note{font-family:'JetBrains Mono',monospace;font-size:10px;color:#66757f;margin-top:14px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="eyebrow">สรุปเข้ม VOCAB · แผน 71 วัน</div>
    <h1>แผนท่องศัพท์รายวัน</h1>
    <div class="sub">เริ่ม 22 ส.ค. 2569 — จบ 31 ต.ค. 2569 · ทบทวนคำเก่าก่อนขึ้นวันใหม่เสมอ</div>
  </div>

  <div class="info-banner" id="infoBanner"></div>

  <div class="stats-bar">
    <div class="stat-card sage"><div class="sv" id="statKnown">0</div><div class="sl">จำได้แล้ว</div></div>
    <div class="stat-card gold"><div class="sv" id="statPracticed">0</div><div class="sl">ฝึกเขียนแล้ว</div></div>
    <div class="stat-card crimson"><div class="sv" id="statWeak">0</div><div class="sl">ต้องฝึกซ้ำ</div></div>
    <div class="stat-card"><div class="sv" id="statTotal">0</div><div class="sl">คำทั้งหมด</div></div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ค้นหาคำศัพท์คำไหนก็ได้ (ไม่นับความคืบหน้า)...">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="toolrow">
    <div class="tool-btn active" id="btnPlanView">📅 แผนรายวัน</div>
    <div class="tool-btn" id="btnRootView">🌳 เรียกดูตามราก</div>
  </div>

  <div class="root-panel" id="rootPanel"></div>

  <div id="planView">
    <div class="day-strip" id="dayStrip"></div>
    <div class="day-panel" id="dayPanel"></div>
  </div>

  <div class="sync-note" id="syncNote">กำลังโหลดความคืบหน้าที่บันทึกไว้...</div>
</div>

<script>
const WORDS = [{"w":"abandon","p":"v.","t":"ละทิ้ง ปล่อย เลิกคิด","e":"We had to abandon our car and walk back home.","u":"มักใช้กับการทิ้งรถ ทิ้งบ้าน ทิ้งแผนงาน หรือเลิกทำสิ่งที่เริ่มไว้กลางคัน"},{"w":"abdicate","p":"v.","t":"ละทิ้ง ปล่อย เลิกคิด (ความหมายใกล้เคียงกับ abandon)","e":"King Edward VIII abdicated the throne in 1936 to marry the woman he loved.","u":"มักใช้กับการทิ้งรถ ทิ้งบ้าน ทิ้งแผนงาน หรือเลิกทำสิ่งที่เริ่มไว้กลางคัน","own":1,"n":"เป็นทางการมาก ใช้เฉพาะกับการสละอำนาจ ตำแหน่ง หรือหน้าที่ (เช่น สละราชสมบัติ) ไม่ใช้กับการทิ้งของทั่วไปแบบ abandon"},{"w":"desert","p":"v.","t":"ละทิ้ง ปล่อย เลิกคิด (ความหมายใกล้เคียงกับ abandon)","e":"He deserted his wife and children without leaving a note.","u":"มักใช้กับการทิ้งรถ ทิ้งบ้าน ทิ้งแผนงาน หรือเลิกทำสิ่งที่เริ่มไว้กลางคัน","own":1,"n":"มีนัยไปทาง “ทรยศ ทอดทิ้ง” คนหรือกลุ่มที่พึ่งพาเราอยู่ ความหมายเชิงลบและรุนแรงกว่า abandon เช่น desert the army"},{"w":"forsake","p":"v.","t":"ละทิ้ง ปล่อย เลิกคิด (ความหมายใกล้เคียงกับ abandon)","e":"She vowed never to forsake the friends who had stood by her.","u":"มักใช้กับการทิ้งรถ ทิ้งบ้าน ทิ้งแผนงาน หรือเลิกทำสิ่งที่เริ่มไว้กลางคัน","own":1,"n":"เป็นภาษาวรรณกรรมหรือทางการแบบโบราณ ให้อารมณ์ลึกซึ้ง (มักพบในบทกวี งานศาสนา) แทบไม่ใช้ในบทสนทนาทั่วไป"},{"w":"surrender","p":"v.","t":"ละทิ้ง ปล่อย เลิกคิด (ความหมายใกล้เคียงกับ abandon)","e":"The soldiers surrendered to enemy forces after running out of supplies.","u":"มักใช้กับการทิ้งรถ ทิ้งบ้าน ทิ้งแผนงาน หรือเลิกทำสิ่งที่เริ่มไว้กลางคัน","own":1,"n":"ใช้เฉพาะกับการยอมแพ้ภายใต้แรงกดดันหรือการต่อสู้ เช่น ยอมจำนนต่อศัตรูหรือตำรวจ ไม่ใช้กับการทิ้งของทั่วไป"},{"w":"give up","p":"v.","t":"ละทิ้ง ปล่อย เลิกคิด (ความหมายใกล้เคียงกับ abandon)","e":"After three failed attempts, he finally gave up trying to fix the engine.","u":"มักใช้กับการทิ้งรถ ทิ้งบ้าน ทิ้งแผนงาน หรือเลิกทำสิ่งที่เริ่มไว้กลางคัน","own":1,"n":"ไม่เป็นทางการที่สุดในกลุ่มนี้ ใช้ในชีวิตประจำวัน เช่น เลิกบุหรี่ (give up smoking) หรือเลิกพยายาม"},{"w":"abandonment","p":"n.", ","p":"v.","t":"ย่อ เขียนให้สั้นลง (ความหมายใกล้เคียงกับ abbreviate)","e":"We had to shorten the meeting because the room was booked at noon.","u":"มักใช้กับการย่อชื่อ คำ หรือข้อความให้สั้นลง เช่นชื่อเล่น คำศัพท์เฉพาะทาง","own":1,"n":"เป็นคำกลางๆ ที่ใช้ง่ายที่สุดในกลุ่มนี้ ใช้ได้กับทั้งเวลา ความยาว และข้อความ"},{"w":"abbreviation","p":"n.","t":"คำย่อ (รูปคำที่แผลงมาจาก abbreviate)","e":"“Dr.” is a common abbreviation for “Doctor.”","u":"มักใช้กับการย่อชื่อ คำ หรือข้อความให้สั้นลง เช่นชื่อเล่น คำศัพท์เฉพาะทาง","own":1},{"w":"abbreviated","p":"adj.","t":"ที่ถูกย่อให้สั้นลง (รูปคำที่แผลงมาจาก abbreviate)","e":"We only had time for an abbreviated version of the presentation.","u":"มักใช้กับการย่อชื่อ คำ หรือข้อความให้สั้นลง เช่นชื่อเล่น คำศัพท์เฉพาะทาง","own":1},{"w":"abduct","p":"v.","t":"ลักพาตัว","e":"Her daughter was abducted late last night.","u":"ใช้กับข่าวอาชญากรรม การลักพาตัวคนไปโดยใช้กำลังหรือหลอกลวง"},{"w":"steal","p":"v.","t":"ลักพาตัว (ความหมายใกล้เคียงกับ abduct)","e":"Someone stole my bicycle from outside the library.","u":"ใช้กับข่าวอาชญากรรม การลักพาตัวคนไปโดยใช้กำลังหรือหลอกลวง","own":1,"n":"ปกติใช้กับการขโมย “สิ่งของ” ไม่ใช่คน จะตรงกับ abduct ก็ต่อเมื่อพูดถึงการลักตัวเด็ก (steal a child)"},{"w":"kidnap","p":"v.","t":"ลักพาตัว (ความหมายใกล้เคียงกับ abduct)","e":"The businessman was kidnapped and held for ransom.","u":"ใช้กับข่าวอาชญากรรม การลักพาตัวคนไปโดยใช้กำลังหรือหลอกลวง","own":1,"n":"ใช้บ่อยกว่า abduct ในภาษาข่าวและชีวิตประจำวัน มักมีนัยเรียกค่าไถ่ ส่วน abduct เป็นทางการ/กฎหมายมากกว่า"},{"w":"abduction","p":"n.","t":"การลักพาตัว (รูปคำที่แผลงมาจาก abduct)","e":"Police are investigating the abduction of a local schoolgirl.","u":"ใช้กับข่าวอาชญากรรม การลักพาตัวคนไปโดยใช้กำลังหรือหลอกลวง","own":1},{"w":"abductor","p":"n.","t":"ผู้ลักพาตัว (รูปคำที่แผลงมาจาก abduct)","e":"The abductor was arrested at the border two days later.","u":"ใช้กับข่าวอาชญากรรม การลักพาตัวคนไปโดยใช้กำลังหรือหลอกลวง","own":1},{"w":"ability","p":"n.","t":"ความสามารถ","e":"He comp utal attack","own":1},{"w":"brute","p":"n.","t":"สัตว์ร้าย คนโหดร้าย (รูปคำที่แผลงมาจาก brutal)","e":"He seized her arm with brute force.","u":"ใช้บรรยายความรุนแรงที่โหดร้ายทารุณ มักใช้ในข่าวอาชญากรรม เช่น brutal attack","own":1},{"w":"brutalization","p":"n.","t":"การทารุณกรรม (รูปคำที่แผลงมาจาก brutal)","e":"The war led to the brutalization of an entire generation.","u":"ใช้บรรยายความรุนแรงที่โหดร้ายทารุณ มักใช้ในข่าวอาชญากรรม เช่น brutal attack","own":1},{"w":"brutalize","p":"v.","t":"ทารุณกรรม (รูปคำที่แผลงมาจาก brutal)","e":"Years of conflict had brutalized the soldiers.","u":"ใช้บรรยายความรุนแรงที่โหดร้ายทารุณ มักใช้ในข่าวอาชญากรรม เช่น brutal attack","own":1},{"w":"brutally","p":"adv.","t":"อย่างโหดร้ายทารุณ (รูปคำที่แผลงมาจาก brutal)","e":"He was brutally honest about my chances.","u":"ใช้บรรยายความรุนแรงที่โหดร้ายทารุณ มักใช้ในข่าวอาชญากรรม เช่น brutal attack","own":1},{"w":"burglar","p":"n.","t":"คนขโมย นักย่องเบา","e":"The burglar got in through the kitchen window.","u":"ใช้เรียกโจรที่บุกเข้าบ้าน/อาคารเพื่อขโมยของ ต่างจาก robber ที่ปล้นแบบเผชิญหน้า"},{"w":"robber","p":"n.","t":"คนขโมย นักย่องเบา (ความหมายใกล้เคียงกับ burglar)","e":"The bank robbers escaped with half a million dollars.","u":"ใช้เรียกโจรที่บุกเข้าบ้าน/อาคารเพื่อขโมยของ ต่างจาก robber ที่ปล้นแบบเผชิญหน้า","own":1,"n":"เน้นการปล้นแบบเผชิญหน้าโดยใช้กำลังขู่เข็ญ ต่างจาก burglar ที่ลอบเข้าไปตอนไม่มีคน"},{"w":"intruder","p":"n.","t":"คนขโมย นักย่องเบา (ความหมายใกล้เคียงกับ burglar)","e":"The alarm woke us and the intruder fled.","u":"ใช้เรียกโจรที่บุกเข้าบ้าน/อาคารเพื่อขโมยของ ต่างจาก robber ที่ปล้นแบบเผชิญหน้า","own":1,"n":"เน้นผู้บุกรุกเข้ามาในพื้นที่โดยไม่ได้รับอนุญาต ไม่จำเป็นต้องขโมยของ"},{"w":"house-breaker","p":"n.","t":"คนขโมย นักย่องเบา (ความหมายใกล้เคียงกับ burglar)","e":"The house-breaker forced the back door open.","u":"ใช้เรียกโจรที่บุกเข้าบ้าน/อาคารเพื่อขโมยของ ต่างจาก robber ที่ปล้นแบบเผชิญหน้า","own":1,"n":"เป็นคำเก่า/ทางการ หมายถึงคนที่งัดแงะเข้าบ้าน ปัจจุบันใช้ burglar มากกว่า"}, function detectPrefix(word){
  const w = word.toLowerCase();
  let best = null;
  for(const item of PREFIXES){
    if(w.startsWith(item.p) && w.length > item.p.length + 3){
      if(!best || item.p.length > best.p.length) best = item;
    }
  }
  return best ? best.label : null;
}

function posExplain(p){
  const parts = p.split(',').map(s=>s.trim());
  const found = parts.map(part => POS_EXPLAIN[part]).filter(Boolean);
  if(found.length) return found.join(' / ');
  return 'ใช้ตามชนิดคำที่กำกับไว้ (' + p + ')';
}

function classifyContext(example){
  if(!example) return null;
  const low = example.toLowerCase();
  for(const cat of CONTEXT_CATEGORIES){
    if(cat.kws.some(k => low.includes(k))) return cat.label;
  }
  return null;
}

function wordRelation(w){
  const synMatch = w.t.match(/\(ความหมายใกล้เคียงกับ ([^)]+)\)/);
  if(synMatch) return {type:'synonym', rel:synMatch[1]};
  const formMatch = w.t.match(/\(รูปคำที่แผลงมาจาก ([^)]+)\)/);
  if(formMatch) return {type:'form', rel:formMatch[1]};
  return {type:'headword', rel:null};
}
function usageNote(w){
  // Derived entries (synonyms / grammatical word-forms) shouldn't just repeat
  // their headword's specific tip verbatim -- that reads as duplicated content.
  // Give them their own short, honest relational note instead; only the true
  // 295 headwords get the full hand-written collocation tip.
  const rel = wordRelation(w);
  if(rel.type === 'synonym'){
    const nuance = w.n || SYN_NUANCE[w.w.toLowerCase()];
    if(nuance){
      return `${posExplain(w.p)} · ${nuance}`;
    }
    return `${posExplain(w.p)} · "${w.w}" ใช้แทนคำว่า "${rel.rel}" ได้ในความหมายใกล้เคียงกัน แต่ยังไม่มีบันทึกความต่างด้านโทน/บริบทที่ชัดเจน — ควรตรวจสอบเพิ่มก่อนใช้แทนกันแบบตรงตัวทุกที่`;
  }
  if(rel.type === 'form'){
    // a hand-written note (w.n) always wins over the generic template
    if(w.n) return `${posExplain(w.p)} · ${w.n}`;
    return `${posExplain(w.p)} · "${w.w}" เป็นรูปคำที่แผลงมาจาก "${rel.rel}" ใช้ในบริบทเดียวกัน แต่เปลี่ยนชนิดคำเป็น ${w.p}`;
  }
  if(w.u){ return w.u; }
  const ctx = classifyContext(w.e);
  const base = posExplain(w.p);
  return ctx ? `${base} · มักพบในบริบทเกี่ยวกับ${ctx}` : base;
}

// from their headword (the book never gives each synonym its own sentence),
// so it will not literally contain the word being studied. Showing it without
// saying so reads as a mistake. exampleInfo() makes that explicit instead.
function exampleInfo(w){
  const rel = wordRelation(w);
  if(!w.e) return {text:null, label:null};
  if(rel.type === 'headword') return {text:w.e, label:'ตัวอย่างการใช้ในบริบท'};
  // w.own === 1 marks entries given their own hand-written sentence.
  if(w.own) return {text:w.e, label:'ตัวอย่างการใช้ในบริบท'};
  return {text:w.e, label:`ตัวอย่างของ "${rel.rel}" (คำต้นตระกูลของ "${w.w}" — ยังไม่มีตัวอย่างเฉพาะของคำนี้)`};
}
const CONTENT_DAYS = Math.max(...WORDS.map(w=>w.day));
function getWordsForDay(day){ return WORDS.filter(w => w.day === day); }
function dayHasContent(day){ return day>=1 && day<=CONTENT_DAYS; }

// ---- state ----

let practiced = new Set();
let mySentences = {};
let dayCompleted = new Set();
let currentDay = 1;
let cardPos = 0;
let flipped = false;
let reviewAcked = {};
let rootOpen = {};

let newWordsMode = 'cards'; // 'cards' | 'quiz'
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;
let quizSelected = null;
let quizForDay = null; // which day the current quizQuestions were built for
// wordStats[idx] = {miss, hit} -- drives which words get drilled again.
// A word is "weak" while miss > hit; it must be answered right twice in a row
// (tracked via streak) before it stops being resurfaced.
let wordStats = {};
let quizIsReviewRound = false;

// ---- persistence ----
async function loadProgress(){
  try{ const k = await window.storage.get('vocabplan-known', false); if(k&&k.value) known = new Set(JSON.parse(k.value)); }catch(e){}
  try{ const p = await window.storage.get('vocabplan-practiced', false); if(p&&p.value) practiced = new Set(JSON.parse(p.value)); }catch(e){}
  try{ const m = await window.storage.get('vocabplan-sentences', false); if(m&&m.value) mySentences = JSON.parse(m.value); }catch(e){}
  try{ const d = await window.storage.get('vocabplan-daycompleted', false); if(d&&d.value) dayCompleted = new Set(JSON.parse(d.value)); }catch(e){}
  try{ const c = await window.storage.get('vocabplan-currentday', false); if(c&&c.value) currentDay = JSON.parse(c.value); }catch(e){}
  try{ const ws = await window.storage.get('vocabplan-wordstats', false); if(ws&&ws.value) wordStats = JSON.parse(ws.value); }catch(e){}
  document.getElementById('syncNote').textContent = 'ความคืบหน้าของคุณถูกบันทึกอัตโนมัติ (เฉพาะในเครื่องนี้)';
}
async function saveKnown(){ try{ await window.storage.set('vocabplan-known', JSON.stringify(Array.from(known)), false); }catch(e){} }
async function savePracticed(){ try{ await window.storage.set('vocabplan-practiced', JSON.stringify(Array.from(practiced)), false); }catch(e){} }
async function saveSentences(){ try{ await window.storage.set('vocabplan-sentences', JSON.stringify(mySentences), false); }catch(e){} }
async function saveDayCompleted(){ try{ await window.storage.set('vocabplan-daycompleted', JSON.stringify(Array.from(dayCompleted)), false); }catch(e){} }
async function saveCurrentDay(){ try{ await window.storage.set('vocabplan-currentday', JSON.stringify(currentDay), false); }catch(e){} }
async function saveWordStats(){ try{ await window.storage.set('vocabplan-wordstats', JSON.stringify(wordStats), false); }catch(e){} }

function firstIncompleteDay(){
  for(let d=1; d<=TOTAL_DAYS; d++){ if(dayHasContent(d) && !dayCompleted.has(d)) return d; }
  return TOTAL_DAYS+1;
}
function isUnlocked(day){ return day <= firstIncompleteDay(); }

function speak(word){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; u.rate = 0.9;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

// ---- progress marking (does NOT trigger a full re-render, so it never interrupts drawing) ----
function markPracticed(idx){
  if(practiced.has(idx)) return;
  practiced.add(idx);
  savePracticed();
  refreshStats();
  document.querySelectorAll(`[data-pcheck="${idx}"]`).forEach(el => el.classList.add('on'));
  const note = document.getElementById('practicedNote');
  if(note) note.classList.add('show');
}
function refreshStats(){
  const sk = document.getElementById('statKnown'); if(sk) sk.textContent = known.size;
  const sp = document.getElementById('statPracticed'); if(sp) sp.textContent = practiced.size;
  const sw = document.getElementById('statWeak'); if(sw) sw.textContent = weakWords().length;
  const st = document.getElementById('statTotal'); if(st) st.textContent = WORDS.length;
  const dprog = document.getElementById('dayProgressText');
  if(dprog){
    const dw = getWordsForDay(currentDay);
    const cnt = dw.filter(w=>practiced.has(w.idx)).length;
    dprog.textContent = `✍️ ฝึกเขียนวันนี้แล้ว ${cnt}/${dw.length} คำ`;
  }
}

// ---------------- Day strip ----------------
function renderDayStrip(){
  const strip = document.getElementById('dayStrip');
  strip.innerHTML = '';
  for(let d=1; d<=TOTAL_DAYS; d++){
    const chip = document.createElement('div');
    chip.className = 'day-chip';
    if(!isUnlocked(d)) chip.classList.add('locked');
    if(dayCompleted.has(d)) chip.classList.add('completed');
    if(d === currentDay) chip.classList.add('current');
    if(!dayHasContent(d)) chip.classList.add('nocontent');
    chip.innerHTML = `<span class="dn">${d}</span><span>${dayCompleted.has(d)?'✓':(dayHasContent(d)?'':'·')}</span>`;
    chip.addEventListener('click', ()=>{
      if(!isUnlocked(d)) { currentDay = d; renderAll(); return; }
      currentDay = d; cardPos = 0; flipped = false;
      saveCurrentDay();
      renderAll();
    });
    strip.appendChild(chip);
  }
}

function reviewOffsetsFor(day){
  const offsets = [
    {k:1, label:'ทบทวน: เมื่อวาน'},{k:3, label:'ทบทวน: 3 วันก่อน'},
    {k:7, label:'ทบทวน: 7 วันก่อน'},{k:14, label:'ทบทวน: 14 วันก่อน'},
  ];
  return offsets.map(o => ({...o, day: day-o.k})).filter(o => dayHasContent(o.day));
}

// Current-day/dayWords context for the ONE persistent delegated listener below.
// Updated every render so the delegated handler always acts on fresh data
// without ever re-attaching itself (which was the bug: re-attaching on every
// render silently piled up duplicate listeners on the persistent #dayPanel
// node, and after enough day/mode switches every tap had to run through all
// of them -- which is what made buttons feel stuck).
let _dpCtx = { d:null, dayWords:[] };
let _dpDelegationBound = false;

function bindDayPanelDelegationOnce(){
  if(_dpDelegationBound) return;
  _dpDelegationBound = true;
  const panelEl = document.getElementById('dayPanel');

  panelEl.addEventListener('click', (e)=>{
    const { d, dayWords } = _dpCtx;

    const speakEl = e.target.closest('[data-speak]');
    if(speakEl){ speak(speakEl.dataset.speak); return; }

    const revealEl = e.target.closest('[data-reveal]');
    if(revealEl){
      revealEl.querySelectorAll('.mt').forEach(mt=>{ mt.style.display = mt.style.display === 'none' ? 'block' : 'none'; });
      return;
    }
    const knownEl = e.target.closest('[data-known]');
    if(knownEl){
      const idx = parseInt(knownEl.dataset.known,10);
      if(known.has(idx)) known.delete(idx); else known.add(idx);
      saveKnown();
      knownEl.classList.toggle('on');
      refreshStats();
      return;
    }
    const modeEl = e.target.closest('[data-newwordsmode]');
    if(modeEl){
      const m = modeEl.dataset.newwordsmode;
      if(m !== newWordsMode){ newWordsMode = m; flipped = false; renderDayPanel(); }
      return;
    }
    const gotoBtn = e.target.closest('#gotoIncompleteBtn');
    if(gotoBtn){
      currentDay = firstIncompleteDay(); cardPos=0; flipped=false; saveCurrentDay(); renderAll();
      return;
    }
    const finishBtn = e.target.closest('#finishDayBtn');
    if(finishBtn){
      dayCompleted.add(d);
      saveDayCompleted();
      if(d < TOTAL_DAYS){ currentDay = d+1; cardPos = 0; flipped = false; saveCurrentDay(); }
      renderAll();
      return;
    }
    // quiz choice / next / restart
    const choiceEl = e.target.closest('[data-choice]');
    if(choiceEl){
      if(quizAnswered) return;
      const val = decodeURIComponent(choiceEl.dataset.choice);
      quizSelected = val; quizAnswered = true;
      const q = quizQuestions[quizIndex];
      const correct = (val === q.correct);
      recordAnswer(q.word.idx, correct);
      if(correct){
        quizScore++;
        // only counts as "known" once it is no longer in the weak list,
        // i.e. two correct answers in a row after a miss
        if(!isWeak(q.word.idx)){ known.add(q.word.idx); saveKnown(); }
      } else {
        // a miss un-marks it: you clearly do not know it yet
        if(known.has(q.word.idx)){ known.delete(q.word.idx); saveKnown(); }
      }
      renderDayPanel();
      return;
    }
    if(e.target.closest('#quizNextBtn')){ quizIndex++; quizAnswered = false; quizSelected = null; renderDayPanel(); return; }
    if(e.target.closest('#quizRestartBtn')){ quizForDay = null; quizIsReviewRound = false; renderDayPanel(); return; }
    if(e.target.closest('#quizWeakBtn')){
      quizQuestions = buildWeakQuiz(20);
      quizIndex = 0; quizScore = 0; quizAnswered = false; quizSelected = null;
      quizForDay = 'weak'; quizIsReviewRound = true;
      renderDayPanel(); return;
    }

    // card-mode controls (only present when newWordsMode === 'cards')
    if(!dayWords || !dayWords.length) return;
    if(e.target.closest('#clearCanvasBtn')){
      const w = dayWords[cardPos];
      setupCanvas(document.getElementById('hwCanvas'), w.w, w.idx, {small:false});
      return;
    }
    if(e.target.closest('#speakBtn')){ speak(dayWords[cardPos].w); return; }
    if(e.target.closest('#prevCardBtn')){ flipped=false; cardPos = cardPos>0?cardPos-1:dayWords.length-1; renderCard(dayWords); return; }
    if(e.target.closest('#nextCardBtn')){ flipped=false; cardPos = cardPos<dayWords.length-1?cardPos+1:0; renderCard(dayWords); return; }
    if(e.target.closest('#flipCardBtn')){ flipped=!flipped; document.getElementById('card').classList.toggle('flipped', flipped); return; }
    if(e.target.closest('#knownCardBtn')){
      const wi = dayWords[cardPos].idx;
      if(known.has(wi)) known.delete(wi); else known.add(wi);
      saveKnown();
      renderCard(dayWords);
      return;
    }
    const cardFace = e.target.closest('#card');
    if(cardFace && !e.target.closest('#mySentenceInput')){
      flipped=!flipped; document.getElementById('card').classList.toggle('flipped', flipped);
      return;
    }
  });

  panelEl.addEventListener('change', (e)=>{
    const { d, dayWords } = _dpCtx;
    if(e.target.id === 'ackCheckbox'){ reviewAcked[d] = e.target.checked; renderDayPanel(); return; }
    if(e.target.id === 'mySentenceInput'){
      const w = dayWords[cardPos];
      mySentences[w.idx] = e.target.value;
      saveSentences();
      return;
    }
  });
}

function wireDayPanelEvents(d, dayWords, reviews){
  _dpCtx = { d, dayWords };
  bindDayPanelDelegationOnce();
}

function renderCard(dayWords){
  const w = dayWords[cardPos];
  document.getElementById('cardPos').textContent = `คำที่ ${cardPos+1} / ${dayWords.length}`;
  document.getElementById('tabFront').textContent = w.w[0].toUpperCase();
  document.getElementById('posTag').textContent = w.p;
  document.getElementById('headword').textContent = w.w;
  document.getElementById('thaiMeaning').textContent = w.t;
  document.getElementById('usageNote').textContent = usageNote(w);
  const exInfo = exampleInfo(w);
  document.getElementById('exampleLabel').textContent = exInfo.label || '';
  document.getElementById('example').textContent = exInfo.text ? exInfo.text : '—';
  const rc = document.getElementById('rootChip');
  if(w.g){ rc.style.display=''; rc.textContent = w.g; } else { rc.style.display='none'; }
  document.getElementById('mySentenceInput').value = mySentences[w.idx] || '';
  const isKnown = known.has(w.idx);
  document.getElementById('knownCardBtn').classList.toggle('active', isKnown);
  document.getElementById('knownLabel').textContent = isKnown ? 'จำได้แล้ว ✓' : 'ทำเครื่องหมายว่าจำได้แล้ว';
  document.getElementById('card').classList.toggle('flipped', flipped);
  const pn = document.getElementById('practicedNote');
  pn.classList.toggle('show', practiced.has(w.idx));
  setupCanvas(document.getElementById('hwCanvas'), w.w, w.idx, {small:false});
}

// bigger, easier-to-write canvas with a ruled baseline; small=true gives a compact version for lists
function setupCanvas(canvas, word, idx, opts){
  opts = opts || {};
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || (opts.small ? 260 : 320);
  const h = rect.height || (opts.small ? 56 : 120);
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const baseline = h * 0.68;
  const fontSize = opts.small ? 20 : 30;
  ctx.font = `${fontSize}px Fraunces, serif`;
  ctx.fillStyle = 'rgba(24,36,48,0.20)';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(word, 10, baseline);

  ctx.strokeStyle = 'rgba(176,144,79,0.5)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(0, baseline+3); ctx.lineTo(w, baseline+3); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = '#b3273c';
  ctx.lineWidth = opts.small ? 2.6 : 3.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let drawing = false;
  let hasStroke = false;
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x:cx,y:cy};
  }
  canvas.onpointerdown = (e)=>{
    drawing = true;
    const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
    if(!hasStroke){ hasStroke = true; if(idx!==undefined) markPracticed(idx); }
  };
  canvas.onpointermove = (e)=>{ if(!drawing) return; const p = getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
  canvas.onpointerup = ()=>{ drawing = false; };
  canvas.onpointerleave = ()=>{ drawing = false; };
}

// ---------------- Daily exercises (quiz) ----------------
function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function cleanMeaning(t){
  return t.replace(/\s*\(ความหมายใกล้เคียงกับ[^)]*\)/,'').replace(/\s*\(รูปคำที่แผลงมาจาก[^)]*\)/,'').trim();
}
function pickDistractors(pool, exclude, n){
  const candidates = pool.filter(x => x.idx !== exclude.idx);
  return shuffleArr(candidates).slice(0, n);
}
function statFor(idx){
  const s = wordStats[idx];
  return s ? {miss:s.miss||0, hit:s.hit||0, streak:s.streak||0} : {miss:0, hit:0, streak:0};
}
function isWeak(idx){
  const s = statFor(idx);
  // needs two consecutive correct answers to graduate out of the drill list
  return s.miss > 0 && s.streak < 2;
}
function weakWords(){
  return WORDS.filter(w => isWeak(w.idx))
              .sort((a,b) => statFor(b.idx).miss - statFor(a.idx).miss);
}
function recordAnswer(idx, correct){
  const s = statFor(idx);
  if(correct){ s.hit++; s.streak++; } else { s.miss++; s.streak = 0; }
  wordStats[idx] = s;
  saveWordStats();
}
function makeQuestion(w, pool){
  const escaped = w.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const canFillBlank = w.e && new RegExp(escaped, 'i').test(w.e);
  if(canFillBlank && Math.random() < 0.55){
    const blanked = w.e.replace(new RegExp(escaped, 'i'), '_____');
    const distractors = pickDistractors(pool, w, 3).map(x=>x.w);
    return { type:'fill', word:w, prompt: blanked, correct: w.w, choices: shuffleArr([w.w, ...distractors]) };
  }
  const distractors = pickDistractors(pool, w, 3).map(x=>cleanMeaning(x.t));
  return { type:'meaning', word:w, prompt: `"${w.w}" (${w.p}) แปลว่าอะไร?`, correct: cleanMeaning(w.t), choices: shuffleArr([cleanMeaning(w.t), ...distractors]) };
}
// Build a drill made only of previously-missed words (from any day).
function buildWeakQuiz(limit){
  const pool = WORDS.length > 40 ? WORDS : WORDS;
  const ws = weakWords().slice(0, limit || 20);
  return shuffleArr(ws.map(w => makeQuestion(w, pool)));
}
function buildQuizForDay(dayWords){
  // Use the whole word list as a distractor pool so questions don't get easy
  // just because a day's words share a theme; fall back to dayWords if small.
  const pool = WORDS.length > 40 ? WORDS : dayWords;
  const qs = dayWords.map(w=>{
    const escaped = w.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const canFillBlank = w.e && new RegExp(escaped, 'i').test(w.e);
    if(canFillBlank && Math.random() < 0.55){
      const blanked = w.e.replace(new RegExp(escaped, 'i'), '_____');
      const distractors = pickDistractors(pool, w, 3).map(x=>x.w);
      return { type:'fill', word:w, prompt: blanked, correct: w.w, choices: shuffleArr([w.w, ...distractors]) };
    }
    const distractors = pickDistractors(pool, w, 3).map(x=>cleanMeaning(x.t));
    return { type:'meaning', word:w, prompt: `"${w.w}" (${w.p}) แปลว่าอะไร?`, correct: cleanMeaning(w.t), choices: shuffleArr([cleanMeaning(w.t), ...distractors]) };
  });
  // Mix in up to 5 previously-missed words from earlier days so weak items keep
  // coming back instead of being seen once and forgotten.
  const todayIdx = new Set(dayWords.map(w=>w.idx));
  const carryOver = weakWords().filter(w=>!todayIdx.has(w.idx)).slice(0,5);
  return shuffleArr(qs.concat(carryOver.map(w=>makeQuestion(w, pool))));
}

function renderQuizBlock(dayWords, d){
  if(quizForDay !== d && quizForDay !== 'weak'){
    quizQuestions = buildQuizForDay(dayWords);
    quizIndex = 0; quizScore = 0; quizAnswered = false; quizSelected = null;
    quizForDay = d; quizIsReviewRound = false;
  }
  const weakCount = weakWords().length;
  const weakBtn = weakCount > 0
    ? `<button class="cbtn" id="quizWeakBtn" style="width:100%;margin-top:8px;background:rgba(179,39,60,0.14);border-color:rgba(179,39,60,0.45);color:var(--crimson);">🎯 ฝึกเฉพาะคำที่เคยตอบผิด (${weakCount} คำ)</button>`
    : '';
  const total = quizQuestions.length;
  if(total === 0){
    return `<div class="quiz-result">
      <div class="quiz-result-label">ไม่มีคำที่ต้องฝึกซ้ำแล้ว 🎉</div>
      <button class="cbtn primary" id="quizRestartBtn" style="width:100%;margin-top:14px;">กลับไปแบบฝึกหัดของวันนี้</button>
    </div>`;
  }
  if(quizIndex >= total){
    const stillWeak = weakWords().length;
    return `<div class="quiz-result">
      <div class="quiz-result-score">${quizScore} / ${total}</div>
      <div class="quiz-result-label">ตอบถูก${stillWeak ? ` · ยังมี ${stillWeak} คำที่ต้องฝึกซ้ำ` : ' · ไม่มีคำค้างแล้ว 🎉'}</div>
      <button class="cbtn primary" id="quizRestartBtn" style="width:100%;margin-top:14px;">🔁 ทำแบบฝึกหัดชุดใหม่</button>
      ${weakBtn}
    </div>`;
  }
  const q = quizQuestions[quizIndex];
  const promptHtml = q.type === 'fill'
    ? `<div class="quiz-fill">${q.prompt}</div>`
    : `<div class="quiz-word">${q.prompt}</div>`;
  const choicesHtml = q.choices.map(c=>{
    let cls = 'quiz-choice';
    if(quizAnswered){
      if(c === q.correct) cls += ' correct';
      else if(c === quizSelected) cls += ' wrong';
    }
    return `<div class="${cls}" data-choice="${encodeURIComponent(c)}">${c}</div>`;
  }).join('');
  const st = statFor(q.word.idx);
  const weakBadge = st.miss > 0
    ? `<span style="color:var(--crimson);"> · ⚠️ เคยตอบผิด ${st.miss} ครั้ง</span>` : '';
  return `<div class="quiz-wrap">
    <div class="quiz-progress">${quizIsReviewRound ? '🎯 รอบฝึกคำที่เคยผิด · ' : ''}ข้อที่ ${quizIndex+1} / ${total} · ถูก ${quizScore} ข้อ${weakBadge}</div>
    ${promptHtml}
    <div class="quiz-choices">${choicesHtml}</div>
    ${quizAnswered ? `<div class="quiz-example">${q.word.e && q.type!=='fill' ? exampleInfo(q.word).label+': “'+q.word.e+'”' : ''}</div><button class="cbtn primary" id="quizNextBtn" style="width:100%;margin-top:10px;">${quizIndex+1<total ? 'ข้อถัดไป →' : 'ดูผลคะแนน'}</button>` : ''}
  </div>`;
}

// ---------------- Root browse panel ----------------
function renderRootPanel(){
  const groupMap = {};
  WORDS.forEach(w=>{ if(w.g){ (groupMap[w.g] = groupMap[w.g]||[]).push(w); } });
  const groups = Object.keys(groupMap).filter(g=>groupMap[g].length>=3).sort();
  const panel = document.getElementById('rootPanel');
  panel.innerHTML = groups.map(g => {
    const open = rootOpen[g];
    const rows = open ? groupMap[g].map(w=>miniBlockHTML(w, {tag:'root', showKnown:false})).join('') : '';
    return `<div class="root-group ${open?'open':''}" data-group="${g}">
      <div class="root-group-head" data-toggle="${g}"><span>${g}</span><span>${groupMap[g].length} คำ ${open?'▲':'▼'}</span></div>
      <div class="root-group-body">${rows}</div>
    </div>`;
  }).join('');

  panel.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{ rootOpen[el.dataset.toggle] = !rootOpen[el.dataset.toggle]; renderRootPanel(); });
  });
  panel.querySelectorAll('[data-speak]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); speak(el.dataset.speak); });
  });
  panel.querySelectorAll('[data-reveal]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); el.querySelectorAll('.mt').forEach(mt=>{ mt.style.display = mt.style.display==='none' ? 'block':'none'; }); });
  });
  Object.keys(groupMap).forEach(g=>{
    if(rootOpen[g]) setupAllMiniCanvases(groupMap[g], 'root');
  });
}

// ---------------- Search ----------------
document.getElementById('searchInput').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  const box = document.getElementById('searchResults');
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const matches = WORDS.filter(w => w.w.toLowerCase().includes(q) || w.t.includes(e.target.value.trim())).slice(0,12);
  if(matches.length===0){ box.innerHTML = '<div class="search-row">ไม่พบคำนี้</div>'; box.classList.add('show'); return; }
  box.innerHTML = matches.map(w=>`
    <div class="search-row" data-idx="${w.idx}">
      <div class="sw">${w.w} <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#8b98a3;">· วันที่ ${w.day} · ${w.p}</span></div>
      <div class="sr">${w.t}<br><i>${exampleInfo(w).text ? exampleInfo(w).label+': "'+exampleInfo(w).text+'"' : ''}</i></div>
    </div>`).join('');
  box.classList.add('show');
  box.querySelectorAll('.search-row').forEach(row=>{ row.addEventListener('click', ()=> row.classList.toggle('open')); });
});

// ---------------- View toggle ----------------
document.getElementById('btnPlanView').addEventListener('click', ()=>{
  viewMode='plan';
  document.getElementById('btnPlanView').classList.add('active');
  document.getElementById('btnRootView').classList.remove('active');
  document.getElementById('planView').style.display='';
  document.getElementById('rootPanel').classList.remove('show');
});
document.getElementById('btnRootView').addEventListener('click', ()=>{
  viewMode='root';
  document.getElementById('btnRootView').classList.add('active');
  document.getElementById('btnPlanView').classList.remove('active');
  document.getElementById('planView').style.display='none';
  document.getElementById('rootPanel').classList.add('show');
});

function renderAll(){
  renderInfoBanner();
  renderDayStrip();
  renderDayPanel();
  refreshStats();
}

(async function init(){
  await loadProgress();
  // If the word list has changed size since the last save (e.g. more words were
  // added), old day/position progress no longer lines up with the new day
  // boundaries -- reset navigation (but keep known/practiced/sentences) so the
  // person always lands on Day 1 with a consistent, non-stale view.
  // Signature covers everything that changes day boundaries, not just the word
  // count -- rescheduling keeps the same words but different days.
  const SCHEDULE_SIG = `${WORDS.length}|${PER_DAY}|${TOTAL_DAYS}|${START_DATE.getTime()}`;
  let savedSig = null;
  try{
    const wc = await window.storage.get('vocabplan-schedule-v2', false);
    savedSig = wc && wc.value ? JSON.parse(wc.value) : null;
  }catch(e){ savedSig = null; } // missing key throws; treat as "no saved schedule"
  if(savedSig !== SCHEDULE_SIG){
    currentDay = 1; cardPos = 0; flipped = false; dayCompleted = new Set(); reviewAcked = {};
    try{ await saveCurrentDay(); await saveDayCompleted(); }catch(e){}
    try{ await window.storage.set('vocabplan-schedule-v2', JSON.stringify(SCHEDULE_SIG), false); }catch(e){}
  }
  renderInfoBanner();
  renderRootPanel();
  renderAll();
})();
</script>
